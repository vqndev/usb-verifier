<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USB Verifier</title>
  </head>
  <body>
    <div id="app">
      <h1>USB Verifier</h1>
      <p class="support" id="support"></p>

      <div class="slots">
        <section class="slot" data-slot="1">
          <h2>Device 1</h2>
          <div class="controls">
            <button data-mode="serial">Serial</button>
            <button data-mode="hid">HID</button>
            <button data-mode="keyboard">Keyboard</button>
            <button data-mode="stop" class="stop">Stop</button>
            <button data-mode="clear" class="clear">Clear</button>
          </div>
          <p class="status">Idle.</p>
          <div class="output"></div>
        </section>

        <section class="slot" data-slot="2">
          <h2>Device 2</h2>
          <div class="controls">
            <button data-mode="serial">Serial</button>
            <button data-mode="hid">HID</button>
            <button data-mode="keyboard">Keyboard</button>
            <button data-mode="stop" class="stop">Stop</button>
            <button data-mode="clear" class="clear">Clear</button>
          </div>
          <p class="status">Idle.</p>
          <div class="output"></div>
        </section>
      </div>

      <div class="io-row">
        <button id="export-btn">Export to Clipboard</button>
        <button id="export-file-btn">Export to File</button>
        <button id="import-btn">Import from Clipboard</button>
        <button id="import-file-btn">Import from File</button>
        <input type="file" id="import-file-input" accept=".txt,.diff,text/plain" hidden />
        <span class="io-status" id="io-status"></span>
      </div>

      <section class="diff-panel">
        <h2>Diff</h2>
        <div class="diff-verdict" id="diff-verdict">Waiting for scans on both devices…</div>
        <pre class="diff-view" id="diff-view"></pre>
        <div id="dl-diff"></div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
